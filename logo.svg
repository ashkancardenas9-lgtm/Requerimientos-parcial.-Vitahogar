<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">VitaHogar</title>
  <desc id="d">Logo de VitaHogar: una casa con una cruz médica en el centro</desc>

  <!-- Fondo blanco para que se vea bien en modo claro y oscuro de GitHub -->
  <rect width="540" height="180" rx="16" fill="#FFFFFF"/>

  <!-- Icono: casa + cruz médica -->
  <g transform="translate(24,16)">
    <!-- Cuerpo de la casa -->
    <path d="M16 62 L70 16 L124 62 L124 124 Q124 130 118 130 L22 130 Q16 130 16 124 Z" fill="#0F9D8A"/>
    <!-- Techo -->
    <path d="M2 68 L70 8 L138 68" fill="none" stroke="#12355B" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cruz médica -->
    <rect x="60" y="70" width="20" height="48" rx="4" fill="#FFFFFF"/>
    <rect x="46" y="84" width="48" height="20" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Nombre -->
  <text x="190" y="98" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700" fill="#12355B">Vita<tspan fill="#0F9D8A">Hogar</tspan></text>

  <!-- Eslogan -->
  <text x="192" y="130" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5B6B7A">Prevención que llega a tu puerta</text>
</svg>
